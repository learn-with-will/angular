<div class="mx-auto max-w-7xl px-4 pt-12 pb-6 sm:px-6">
  <header class="mb-9 max-w-2xl">
    <h1 class="heading text-[3.25rem] leading-none tracking-[-0.035em]">Saved</h1>
    <p class="prose-muted mt-3 text-[1.0625rem]">Bites you’ve saved for later.</p>
  </header>

  @if (bookmarked().length) {
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (lesson of bookmarked(); track lesson.slug) {
        <app-lesson-card [lesson]="lesson" />
      }
    </div>
  } @else {
    <div class="card border-dashed px-6 py-14 text-center">
      <span
        class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-2xl bg-magenta-50 text-magenta-600 dark:bg-magenta-950 dark:text-magenta-300"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 4h12v16l-6-4-6 4V4Z" stroke-linejoin="round" />
        </svg>
      </span>
      <p class="font-semibold text-ink-900 dark:text-white">Nothing saved yet.</p>
      <p class="prose-muted mx-auto mt-1 max-w-sm text-sm">Tap the bookmark icon on any bite to keep it here.</p>
      <a routerLink="/lessons" class="btn-primary mt-5">
        Browse bites
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M5 12h14m-6-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>
  }
</div>
