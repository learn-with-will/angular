@switch (auth.status()) {
  @case ('signed-out') {
    <button type="button" class="btn-secondary mr-1 hidden lg:inline-flex" (click)="auth.openSignIn()">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20a7.5 7.5 0 0 1 15 0" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Sign in
    </button>
    <button
      type="button"
      class="btn-icon lg:hidden"
      aria-label="Sign in to save your progress"
      title="Sign in to save your progress"
      (click)="auth.openSignIn()"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20a7.5 7.5 0 0 1 15 0" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  }

  @case ('checking') {
    <!-- Holds the avatar's place while a returning session is restored, so nothing shifts. -->
    <span class="mr-1 h-10 w-10 shrink-0 animate-pulse rounded-full bg-ink-200 dark:bg-ink-800" role="status" aria-label="Checking sign-in"></span>
  }

  @case ('signed-in') {
    @if (auth.user(); as user) {
      <div class="relative mr-1">
        <button
          type="button"
          class="focusable grid h-10 w-10 shrink-0 cursor-pointer place-items-center overflow-hidden rounded-full bg-brand-100 text-sm font-extrabold text-brand-700 ring-2 ring-brand-200 transition hover:ring-brand-400 dark:bg-brand-950 dark:text-brand-300 dark:ring-brand-800"
          [attr.aria-expanded]="open()"
          aria-controls="account-panel"
          [attr.aria-label]="'Account: ' + displayName()"
          (click)="toggle()"
        >
          @if (user.photoURL) {
            <img [src]="user.photoURL" alt="" referrerpolicy="no-referrer" class="h-full w-full object-cover" />
          } @else {
            {{ initial() }}
          }
        </button>

        @if (open()) {
          <div
            id="account-panel"
            class="card absolute top-full right-0 z-40 mt-2 w-72 animate-fade-in p-4 shadow-lift"
          >
            <p class="truncate text-sm font-bold text-ink-900 dark:text-white">{{ displayName() }}</p>
            @if (user.email && user.email !== displayName()) {
              <p class="prose-muted truncate text-xs">{{ user.email }}</p>
            }

            <p class="prose-muted mt-3 flex items-center gap-2 text-xs font-semibold" role="status">
              <span class="h-2 w-2 shrink-0 rounded-full" [class]="syncInfo().dot" aria-hidden="true"></span>
              {{ syncInfo().text }}
            </p>

            <button type="button" class="btn-secondary mt-4 w-full" (click)="signOut()">Sign out</button>
          </div>
        }
      </div>
    }
  }
}
