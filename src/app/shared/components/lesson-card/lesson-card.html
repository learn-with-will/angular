<!--
  The title anchor is stretched over the whole card via a ::before overlay, so
  the bookmark button can sit beside it as a real sibling control rather than
  being nested inside the link.
-->
<article
  class="card-interactive group relative isolate flex h-full flex-col p-5 has-[a:focus-visible]:ring-2 has-[a:focus-visible]:ring-brand-500 has-[a:focus-visible]:ring-offset-2 has-[a:focus-visible]:ring-offset-ink-50 dark:has-[a:focus-visible]:ring-offset-ink-950"
>
  <div class="mb-3 flex items-center justify-between gap-2">
    <span [class]="badgeClass()">
      @if (completed()) {
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
          <path d="m5 13 4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
      {{ levelLabel() }}
    </span>

    <button
      type="button"
      (click)="toggleBookmark()"
      class="focusable relative z-10 -mr-1.5 -mt-1.5 grid h-11 w-11 cursor-pointer place-items-center rounded-full transition hover:bg-ink-100 active:scale-90 dark:hover:bg-ink-800"
      [class]="bookmarked() ? 'text-magenta-500' : 'text-ink-400 hover:text-magenta-500'"
      [attr.aria-label]="
        bookmarked() ? 'Remove bookmark from ' + lesson().title : 'Bookmark ' + lesson().title
      "
      [attr.aria-pressed]="bookmarked()"
    >
      <svg
        class="h-5 w-5 transition-transform duration-200"
        [class.scale-110]="bookmarked()"
        [attr.fill]="bookmarked() ? 'currentColor' : 'none'"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M6 4h12v16l-6-4-6 4V4Z" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <h3 class="mb-1 font-bold text-ink-900 dark:text-white">
    <a
      [routerLink]="['/lesson', lesson().slug]"
      class="outline-none transition-colors before:absolute before:inset-0 before:z-0 before:rounded-2xl group-hover:text-brand-600 dark:group-hover:text-brand-300"
    >
      {{ lesson().title }}
    </a>
  </h3>

  @if (lesson().summary) {
    <p class="prose-muted mb-3 line-clamp-2 text-sm">{{ lesson().summary }}</p>
  }

  <div class="prose-muted mt-auto flex flex-wrap items-center gap-x-3 gap-y-1.5 pt-3 text-xs font-medium">
    <span class="flex items-center gap-1">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" stroke-linecap="round" />
      </svg>
      {{ lesson().duration }} min
    </span>

    @if (completed()) {
      <span class="flex items-center gap-1 font-bold text-emerald-600 dark:text-emerald-400">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="m5 13 4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Completed
      </span>
    }

    @if (quiz(); as q) {
      <span
        class="ml-auto rounded-full px-2 py-0.5 font-bold tabular-nums"
        [class]="
          q.passed
            ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
            : 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300'
        "
      >
        Quiz {{ q.score }}%
      </span>
    }
  </div>
</article>
