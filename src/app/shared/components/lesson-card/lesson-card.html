<!--
  The title anchor is stretched over the whole card via a ::before overlay, so
  the bookmark button can sit beside it as a real sibling control rather than
  being nested inside the link.
-->
<article
  class="card-interactive group relative isolate flex h-full flex-col p-6 has-[a:focus-visible]:ring-2 has-[a:focus-visible]:ring-brand-500 has-[a:focus-visible]:ring-offset-2 has-[a:focus-visible]:ring-offset-ink-50 dark:has-[a:focus-visible]:ring-offset-ink-950"
>
  <div class="flex items-center justify-between gap-2">
    <span class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1">
      <span [class]="kindClass()">{{ kindLabel() }}</span>
      <span class="prose-muted truncate text-[0.8125rem] font-semibold">{{ topicTitle() }}</span>
    </span>

    <button
      type="button"
      (click)="toggleBookmark()"
      class="relative z-10 -mt-2.5 -mr-2.5 grid h-11 w-11 shrink-0 cursor-pointer place-items-center rounded-xl transition hover:bg-ink-100 active:scale-90 dark:hover:bg-ink-800"
      [class]="bookmarked() ? 'text-magenta-500' : 'text-ink-400 hover:text-magenta-500'"
      [attr.aria-label]="bookmarked() ? 'Remove ' + lesson().title + ' from saved' : 'Save ' + lesson().title"
      [attr.aria-pressed]="bookmarked()"
    >
      <svg
        class="h-[1.125rem] w-[1.125rem] transition-transform duration-200"
        [class.scale-110]="bookmarked()"
        [attr.fill]="bookmarked() ? 'currentColor' : 'none'"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M6 4h12v16l-6-4-6 4V4Z" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <h3 class="mt-2 text-xl leading-snug font-bold tracking-[-0.015em] text-ink-900 dark:text-white">
    <a
      [routerLink]="['/lesson', lesson().slug]"
      class="outline-none transition-colors before:absolute before:inset-0 before:z-0 before:rounded-[1.125rem] group-hover:text-brand-600 dark:group-hover:text-brand-300"
    >
      {{ lesson().title }}
    </a>
  </h3>

  <p class="prose-muted mt-2 line-clamp-3 text-[0.9375rem] leading-relaxed">{{ lesson().summary }}</p>

  <div class="prose-muted mt-auto flex flex-wrap items-center gap-x-4 gap-y-1.5 pt-5 text-[0.8125rem] font-semibold">
    <span class="flex items-center gap-1.5">
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" stroke-linecap="round" />
      </svg>
      {{ lesson().minutes }} min read
    </span>

    @if (learned()) {
      <span class="flex items-center gap-1 text-emerald-700 dark:text-emerald-400">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="m5 13 4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Learned
      </span>
    }
  </div>
</article>
