<nav class="text-sm" aria-label="Course outline">
  @for (level of levels; track level) {
    @if (lessonsFor(level).length) {
      <div class="mb-6">
        <p class="mb-2 flex items-center gap-2 text-xs font-extrabold tracking-wider text-ink-400 uppercase">
          <span class="gradient-rule h-0.5 w-3 shrink-0"></span>
          {{ levelLabels[level] }}
        </p>
        <ul class="space-y-0.5">
          @for (lesson of lessonsFor(level); track lesson.id) {
            <li>
              <a
                [routerLink]="['/lesson', lesson.slug]"
                routerLinkActive="bg-brand-50! font-bold! text-brand-700! dark:bg-brand-950! dark:text-brand-300!"
                #rla="routerLinkActive"
                [attr.aria-current]="rla.isActive ? 'page' : null"
                class="focusable flex items-center gap-2.5 rounded-xl px-3 py-2 font-medium text-ink-600 transition hover:bg-ink-100 hover:text-ink-900 dark:text-ink-400 dark:hover:bg-ink-800 dark:hover:text-white"
              >
                @if (progress.isCompleted(lesson.id)) {
                  <svg
                    class="h-3.5 w-3.5 shrink-0 text-emerald-500"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="3.5"
                    aria-hidden="true"
                  >
                    <path d="m5 13 4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <span class="sr-only">Completed:</span>
                } @else {
                  <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-ink-300 dark:bg-ink-600"></span>
                }
                <span class="truncate">{{ lesson.title }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  }
</nav>
