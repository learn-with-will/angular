<header
  class="sticky top-0 z-30 border-b border-ink-200 bg-ink-50/85 backdrop-blur-xl dark:border-ink-800 dark:bg-ink-950/85"
>
  <nav class="mx-auto flex h-17 max-w-7xl items-center gap-1.5 px-4 sm:gap-2 sm:px-6" aria-label="Main">
    <a routerLink="/" class="group mr-3 flex shrink-0 items-center gap-2.5 rounded-xl py-1">
      <app-brand-mark class="h-7.5 w-7.5 transition duration-300 group-hover:-rotate-12" />
      <span class="font-display text-[1.1875rem] font-bold tracking-[-0.02em] text-ink-900 dark:text-white">
        Angular Learn
      </span>
    </a>

    <!-- Desktop links; on mobile these live in the bottom bar instead. -->
    <div class="hidden flex-1 items-center gap-0.5 lg:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-ink-100! font-semibold! text-ink-900! dark:bg-ink-800! dark:text-white!"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="rounded-[0.625rem] px-3.5 py-2 text-sm font-medium text-ink-500 transition duration-200 hover:bg-ink-100 hover:text-ink-900 dark:text-ink-400 dark:hover:bg-ink-800 dark:hover:text-white"
        >
          {{ link.label }}
        </a>
      }
    </div>
    <div class="flex-1 lg:hidden"></div>

    <button
      type="button"
      (click)="openSearch()"
      class="hidden h-10 min-w-56 cursor-pointer items-center gap-2.5 rounded-[0.625rem] border border-ink-200 bg-white px-3 text-sm font-medium whitespace-nowrap text-ink-500 transition hover:border-ink-300 hover:text-ink-900 xl:flex dark:border-ink-800 dark:bg-ink-900 dark:text-ink-400 dark:hover:border-ink-700 dark:hover:text-white"
      [attr.aria-label]="'Search lessons (' + shortcut + ')'"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" stroke-linecap="round" />
      </svg>
      <span class="flex-1 text-left">Search {{ total() || '' }} bites</span>
      <kbd class="kbd" aria-hidden="true">{{ shortcut }}</kbd>
    </button>
    <button type="button" (click)="openSearch()" class="btn-icon h-10 w-10 xl:hidden" aria-label="Search lessons">
      <svg class="h-[1.125rem] w-[1.125rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" stroke-linecap="round" />
      </svg>
    </button>

    <!-- Surprise me: a random bite, favouring ones you have not learned yet. -->
    <a routerLink="/random" class="btn-icon h-10 w-10 max-sm:hidden" aria-label="Surprise me: open a random lesson" title="Surprise me">
      <svg class="h-[1.125rem] w-[1.125rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22M18 2l4 4-4 4M2 6h1.9c1.5 0 2.9.9 3.6 2.2M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8M18 14l4 4-4 4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>

    <button
      type="button"
      (click)="theme.toggle()"
      class="btn-icon h-10 w-10"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="theme.isDark()"
      title="Toggle theme"
    >
      @if (theme.isDark()) {
        <svg class="h-[1.125rem] w-[1.125rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5" stroke-linecap="round" />
        </svg>
      } @else {
        <svg class="h-[1.125rem] w-[1.125rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round" />
        </svg>
      }
    </button>

    <!-- Optional sign-in; renders nothing until Firebase is configured. -->
    <app-account-menu />
  </nav>
</header>

<!--
  Mobile navigation: five destinations is the bottom-bar limit, and each keeps
  an icon + label so the target is discoverable.
-->
<nav
  class="fixed inset-x-0 bottom-0 z-30 border-t border-ink-200 bg-ink-50/95 pb-[env(safe-area-inset-bottom)] backdrop-blur-xl lg:hidden dark:border-ink-800 dark:bg-ink-950/95"
  aria-label="Primary"
>
  <div class="grid grid-cols-5">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="font-bold! text-brand-600! dark:text-brand-300!"
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        class="flex min-h-14 flex-col items-center justify-center gap-1 px-1 py-2 text-[0.6875rem] font-semibold text-ink-500 transition dark:text-ink-400"
      >
        <svg class="h-[1.375rem] w-[1.375rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path [attr.d]="link.icon" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ link.label }}
      </a>
    }
  </div>
</nav>
