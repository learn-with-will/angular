<header
  class="sticky top-0 z-30 border-b border-ink-200/80 bg-ink-50/85 backdrop-blur-xl dark:border-ink-800/80 dark:bg-ink-950/85"
>
  <nav class="mx-auto flex h-16 max-w-7xl items-center gap-1 px-4 sm:px-6" aria-label="Main">
    <a routerLink="/" class="focusable group mr-1 flex shrink-0 items-center gap-2.5 rounded-xl py-1">
      <app-angular-logo class="h-8 w-8 transition duration-300 group-hover:-rotate-6 group-hover:scale-110" />
      <span class="text-base font-extrabold text-ink-900 dark:text-white">
        Angular <span class="gradient-text">Learn</span>
      </span>
    </a>

    <!-- Desktop links; on mobile these live in the bottom bar instead. -->
    <div class="ml-3 hidden flex-1 items-center gap-1 md:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-brand-50! text-brand-700! dark:bg-brand-950! dark:text-brand-300!"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="focusable rounded-full px-4 py-2 text-sm font-semibold text-ink-500 transition duration-200 hover:bg-ink-100 hover:text-ink-900 dark:text-ink-400 dark:hover:bg-ink-800 dark:hover:text-white"
        >
          {{ link.label }}
        </a>
      }
    </div>
    <div class="flex-1 md:hidden"></div>

    <a routerLink="/search" class="btn-icon" aria-label="Search lessons" title="Search lessons">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" stroke-linecap="round" />
      </svg>
    </a>

    <button
      type="button"
      (click)="theme.toggle()"
      class="btn-icon"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="theme.isDark()"
      title="Toggle theme"
    >
      @if (theme.isDark()) {
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round" />
        </svg>
      }
    </button>
  </nav>
</header>

<!--
  Mobile navigation. The four destinations fit the bottom-bar limit of five,
  and each keeps an icon + label so the target is discoverable.
-->
<nav
  class="fixed inset-x-0 bottom-0 z-30 border-t border-ink-200 bg-ink-50/95 backdrop-blur-xl pb-[env(safe-area-inset-bottom)] md:hidden dark:border-ink-800 dark:bg-ink-950/95"
  aria-label="Primary"
>
  <div class="grid grid-cols-4">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="text-brand-600! dark:text-brand-300!"
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        class="focusable relative flex min-h-14 flex-col items-center justify-center gap-1 px-1 py-2 text-[0.6875rem] font-semibold text-ink-500 transition dark:text-ink-400"
      >
        @if (rla.isActive) {
          <span class="gradient-rule absolute top-0 h-0.5 w-8 rounded-b-full"></span>
        }
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path [attr.d]="link.icon" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ link.label }}
      </a>
    }
  </div>
</nav>
