name: Deploy

# The whole deploy of a course: the shared shell's workflow validates the course,
# builds it with the latest shell and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: learn-with-will/course-shell/.github/workflows/deploy-course.yml@main
